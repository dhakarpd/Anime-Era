name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Tests and JaCoCo
        run: ./gradlew testDebugUnitTest jacocoTestReport

      # ✅ Extract coverage from JaCoCo XML
      - name: Extract coverage
        id: coverage
        run: |
          FILE=app/build/reports/jacoco/jacocoTestReport/xml/jacocoTestReport.xml

          if [ ! -f "$FILE" ]; then
            echo "Coverage report not found!"
            exit 1
          fi

          LINE_RATE=$(grep -o 'line-rate="[0-9.]*"' $FILE | head -1 | cut -d'"' -f2)
          COVERAGE=$(echo "$LINE_RATE * 100" | bc)

          echo "Coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      # ✅ Comment on PR (auto update, no spam)
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = parseFloat("${{ steps.coverage.outputs.coverage }}");
            const threshold = 50;
            const marker = "<!-- coverage-comment -->";

            const status = coverage < threshold
              ? "❌ Below threshold (50%)"
              : "✅ Above threshold";

            const body = `${marker}
            📊 **Test Coverage Report**

            | Metric   | Value |
            |----------|-------|
            | Coverage | ${coverage.toFixed(2)}% |

            ${status}
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      # ✅ Enforce coverage threshold (fail build if < 50%)
      - name: Enforce coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          THRESHOLD=50

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
            exit 1
          else
            echo "✅ Coverage check passed"
          fi

      - name: Upload lint HTML report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html